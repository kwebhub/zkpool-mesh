services:
  solana-test-validator:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.test
    image: zkpool-test:latest
    container_name: zkpool-mesh-test-validator
    security_opt:
      - seccomp:unconfined
    ports:
      - "8899:8899"
      - "9900:9900"
    volumes:
      - zkpool-mesh-test-validator-ledger:/home/i/.ledger
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "solana -u http://localhost:8899 cluster-version || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: zkpool-mesh-postgres
    environment:
      POSTGRES_USER: zkpool
      POSTGRES_PASSWORD: zkpool_dev_password
      POSTGRES_DB: zkpool
    ports:
      - "5432:5432"
    volumes:
      - zkpool-mesh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkpool -d zkpool"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zkpool-mesh-redis
    ports:
      - "6379:6379"
    volumes:
      - zkpool-mesh-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: redis-server --appendonly yes
    restart: unless-stopped

  merkle:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.merkle
    image: zkpool-merkle:latest
    container_name: zkpool-mesh-merkle
    working_dir: /home/i/services/merkle
    volumes:
      - ../services/merkle:/home/i/services/merkle
      - ../circuits:/home/i/circuits:ro
    ports:
      - "4003:4003"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  prover:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.backend
    image: zkpool-backend:latest
    container_name: zkpool-mesh-prover
    working_dir: /home/i/services/prover
    volumes:
      - ../services/prover:/home/i/services/prover
      - ../circuits:/home/i/circuits:ro
      - ../.env:/home/i/.env
    ports:
      - "4002:4002"
    depends_on:
      solana-test-validator:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.backend
    image: zkpool-backend:latest
    container_name: zkpool-mesh-backend
    working_dir: /home/i/services/backend
    volumes:
      - ../services/backend:/home/i/services/backend
      - ../.env:/home/i/.env
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      solana-test-validator:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
    image: zkpool-frontend:latest
    container_name: zkpool-mesh-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: zkpool-mesh-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - zkpool-mesh-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - backend
      - prover
      - merkle
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: zkpool-mesh-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - zkpool-mesh-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  zkpool-mesh-postgres-data:
  zkpool-mesh-redis-data:
  zkpool-mesh-prometheus-data:
  zkpool-mesh-grafana-data:
  zkpool-mesh-test-validator-ledger:
