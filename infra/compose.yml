services:
  solana-test-validator:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.test
    image: zkpool-test:latest
    container_name: zkpool-validator
    user: "1000:1000"
    security_opt:
      - seccomp:unconfined
    ports:
      - "8899:8899"
      - "9900:9900"
    volumes:
      - zkpool-validator-ledger:/home/i/.ledger
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "solana -u http://localhost:8899 cluster-version || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: zkpool-postgres
    environment:
      POSTGRES_USER: zkpool
      POSTGRES_PASSWORD: zkpool_dev_password
      POSTGRES_DB: zkpool
    ports:
      - "5432:5432"
    volumes:
      - zkpool-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkpool -d zkpool"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zkpool-redis
    ports:
      - "6379:6379"
    volumes:
      - zkpool-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: redis-server --appendonly yes
    restart: unless-stopped

  mesh:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.base
    image: zkpool-base:latest
    container_name: zkpool-mesh
    stdin_open: true
    tty: true
    working_dir: /home/i
    volumes:
      - ../onchain:/home/i/onchain
      - ../circuits:/home/i/circuits
      - ../services:/home/i/services
      - ../scripts:/home/i/scripts
      - ../tests:/home/i/tests
      - ../solana:/home/i/.config/solana
      - ../.env:/home/i/.env
    ports:
      - "4001:4001"
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      solana-test-validator:
        condition: service_healthy
    restart: unless-stopped

  merkle:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.node-base
    image: zkpool-node-base:latest
    container_name: zkpool-merkle
    working_dir: /home/i/services/merkle
    volumes:
      - ../services/merkle:/home/i/services/merkle
      - ../circuits:/home/i/circuits:ro
    ports:
      - "4003:4003"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
    image: zkpool-frontend:latest
    container_name: zkpool-web
    ports:
      - "8080:80"
    depends_on:
      - mesh
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: zkpool-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - zkpool-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - mesh
      - merkle
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: zkpool-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - zkpool-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  zkpool-postgres-data:
  zkpool-redis-data:
  zkpool-prometheus-data:
  zkpool-grafana-data:
  zkpool-validator-ledger:
